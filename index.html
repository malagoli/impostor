<style>
/* Layout: una colonna stretta come un tavolo da gioco in panno verde; le carte sono l'unico oggetto "fisico". Look unico scuro, scelto di proposito. */
:root {

  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; }

.topbar button { background: none; border: 0; color: var(--text-soft); text-decoration: underline; font-size: .8rem; padding: 4px; }
.err { color: var(--red); font-size: .9rem; }

@media (prefers-reduced-motion: reduce) {
  .flipper { transition: none; }
  .timer.zero { animation: none; }
  .btn { transition: none; }
}

<script>
/* ============================================================
   PAROLE: tre mazzi, uno per livello.
   Ogni voce: [parola, suggerimento 1, suggerimento 2]
   Facile    = parole comuni, suggerimenti molto vicini alla parola
   Medio     = parole meno ovvie, suggerimenti per associazione
   Difficile = parole rare o astratte, suggerimenti vaghi e laterali
   ============================================================ */
const WORDS = {
  facile: [
    ["Pizza","Forno","Napoli"],["Spiaggia","Sabbia","Ombrellone"],["Gatto","Fusa","Baffi"],
    ["Calcio","Pallone","Stadio"],["Gelato","Cono","Freddo"],["Scuola","Zaino","Lavagna"],
    ["Natale","Regali","Dicembre"],["Cane","Guinzaglio","Abbaiare"],["Treno","Binario","Stazione"],
    ["Ospedale","Medico","Barella"],["Caffè","Tazzina","Moka"],["Pasta","Pentola","Sugo"],
    ["Compleanno","Torta","Candeline"],["Telefono","Chiamata","Schermo"],["Bicicletta","Pedali","Catena"],
    ["Neve","Inverno","Pupazzo"],["Libro","Pagine","Lettura"],["Aereo","Ali","Aeroporto"],
    ["Cinema","Popcorn","Biglietto"],["Mare","Onde","Sale"],["Montagna","Vetta","Sentiero"],
    ["Frigorifero","Freddo","Cucina"],["Ombrello","Pioggia","Aprire"],["Chitarra","Corde","Accordi"],
    ["Matrimonio","Sposi","Anelli"],["Supermercato","Carrello","Cassa"],["Pompiere","Incendio","Sirena"],
    ["Dentista","Denti","Trapano"],["Orologio","Lancette","Ore"],["Banana","Gialla","Buccia"],
    ["Piscina","Nuoto","Cloro"],["Zoo","Animali","Gabbie"],["Letto","Cuscino","Dormire"],
    ["Automobile","Volante","Benzina"],["Carnevale","Maschere","Coriandoli"],["Pane","Forno","Briciole"],
    ["Fragola","Rossa","Panna"],["Pioggia","Nuvole","Gocce"],["Sole","Caldo","Estate"],
    ["Polizia","Divisa","Manette"]
  ],
  medio: [
    ["Gondola","Remo","Canale"],["Vulcano","Fumo","Isola"],["Biblioteca","Silenzio","Prestito"],
    ["Faro","Luce","Costa"],["Tiramisù","Strati","Cacao"],["Ascensore","Bottoni","Piano"],
    ["Circo","Tendone","Acrobata"],["Museo","Quadri","Guida"],["Matita","Gomma","Punta"],
    ["Specchio","Riflesso","Vanità"],["Semaforo","Incrocio","Attesa"],["Pinguino","Ghiaccio","Smoking"],
    ["Castello","Torre","Fossato"],["Mercato","Bancarelle","Contrattare"],["Palestra","Sudore","Pesi"],
    ["Farmacia","Ricetta","Croce"],["Arcobaleno","Colori","Pioggia"],["Sottomarino","Profondità","Periscopio"],
    ["Tatuaggio","Pelle","Inchiostro"],["Vendemmia","Settembre","Grappoli"],["Barbiere","Forbici","Barba"],
    ["Campeggio","Tenda","Falò"],["Discoteca","Musica","Notte"],["Pirata","Tesoro","Benda"],
    ["Pesca","Amo","Pazienza"],["Ferragosto","Caldo","Gita"],["Oroscopo","Stelle","Segno"],
    ["Astronauta","Casco","Gravità"],["Cassaforte","Combinazione","Valore"],["Fisarmonica","Mantice","Balera"],
    ["Lotteria","Biglietto","Fortuna"],["Mongolfiera","Cesto","Cielo"],["Sushi","Riso","Bacchette"],
    ["Vampiro","Notte","Aglio"],["Trasloco","Scatoloni","Fatica"],["Sagra","Paese","Stand"],
    ["Ponte","Fiume","Arco"],["Formica","Fila","Briciola"],["Oliva","Ramo","Olio"],
    ["Notaio","Firma","Atto"]
  ],
  difficile: [
    ["Nostalgia","Passato","Fotografia"],["Eclissi","Ombra","Allineamento"],["Burocrazia","Moduli","Coda"],
    ["Labirinto","Muri","Uscita"],["Ipnosi","Pendolo","Sonno"],["Clessidra","Sabbia","Fine"],
    ["Metronomo","Ritmo","Oscillare"],["Eco","Montagna","Ripetere"],["Camaleonte","Colore","Lingua"],
    ["Fantasma","Lenzuolo","Rumore"],["Origami","Carta","Piega"],["Sciopero","Treni","Protesta"],
    ["Ventriloquo","Pupazzo","Voce"],["Sonnambulo","Notte","Braccia"],["Vertigine","Altezza","Girare"],
    ["Telescopio","Lontano","Lente"],["Mosaico","Tessere","Ravenna"],["Equilibrista","Filo","Paura"],
    ["Ornitorinco","Becco","Strano"],["Bonsai","Pazienza","Piccolo"],["Miraggio","Deserto","Illusione"],
    ["Ghigliottina","Rivoluzione","Lama"],["Scacchi","Re","Strategia"],["Karaoke","Microfono","Stonato"],
    ["Amnesia","Vuoto","Ricordi"],["Magnete","Attrazione","Polo"],["Gemelli","Uguali","Due"],
    ["Autostop","Pollice","Strada"],["Galateo","Forchetta","Educazione"],["Anagramma","Lettere","Ordine"],
    ["Superstizione","Gatto","Diciassette"],["Fuso orario","Viaggio","Ore"],["Cometa","Coda","Passaggio"],
    ["Pettegolezzo","Orecchio","Vicini"],["Procrastinare","Domani","Divano"],["Sarcasmo","Tono","Contrario"],
    ["Inflazione","Prezzi","Carrello"],["Gravità","Mela","Cadere"],["Utopia","Perfetto","Isola"],
    ["Coincidenza","Caso","Stesso"]
  ]
};

const DIFF = {
  facile:    { label: "Facile",    desc: "Parole comuni, suggerimenti vicini" },
  medio:     { label: "Medio",     desc: "Parole meno ovvie, indizi per associazione" },
  difficile: { label: "Difficile", desc: "Parole astratte, indizi vaghi" }
};

/* ============================================================
   PUNTEGGIO (per round)
   voto       → ogni cittadino che vota l'impostore
   squadra    → bonus a tutti i cittadini se l'impostore è eliminato e NON indovina la parola
   sopravvive → impostore non eliminato (anche in caso di pareggio)
   inganno    → all'impostore, per ogni cittadino che ha votato un innocente
   indovina   → impostore eliminato che indovina la parola segreta
   Con suggerimenti più vaghi l'impostore rischia di più, quindi guadagna di più.
   ============================================================ */
const SCORING = {
  facile:    { voto: 2, squadra: 1, sopravvive: 4, inganno: 1, indovina: 2 },
  medio:     { voto: 2, squadra: 1, sopravvive: 5, inganno: 1, indovina: 3 },
  difficile: { voto: 2, squadra: 2, sopravvive: 6, inganno: 1, indovina: 4 }
};

const STORE_KEY = "impostore-partita-v1";
let state;
let timerHandle = null;

function freshState(prev) {
  return {
    screen: "setup",
    names: prev?.names ?? ["Giulia", "Marco", "Sara", "Luca", "Chiara"],
    difficulty: prev?.difficulty ?? "medio",
    totalRounds: prev?.totalRounds ?? 5,
    timerSec: prev?.timerSec ?? 90,
    scores: [],
    round: 0,
    used: { facile: [], medio: [], difficile: [] },
    lastImpostor: -1,
    cur: null,
    history: [],
    error: ""
  };
}

function save() {
  try {
    if (state.screen === "setup" || state.screen === "final") localStorage.removeItem(STORE_KEY);
    else localStorage.setItem(STORE_KEY, JSON.stringify(state));
    localStorage.setItem(STORE_KEY + "-setup", JSON.stringify({ names: state.names, difficulty: state.difficulty, totalRounds: state.totalRounds, timerSec: state.timerSec }));
  } catch (e) {}
}
function loadSaved() {
  try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function loadSetup() {
  try { const s = localStorage.getItem(STORE_KEY + "-setup"); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const players = () => state.names;

/* ---------- round setup ---------- */
function pickWord() {
  const deck = WORDS[state.difficulty];
  let used = state.used[state.difficulty];
  if (used.length >= deck.length) used = state.used[state.difficulty] = [];
  const free = deck.map((_, i) => i).filter(i => !used.includes(i));
  const idx = free[rand(free.length)];
  used.push(idx);
  const [word, h1, h2] = deck[idx];
  return { word, hints: [h1, h2] };
}

function startRound() {
  const n = players().length;
  const { word, hints } = pickWord();
  let impostor = rand(n);
  if (n > 3 && impostor === state.lastImpostor) impostor = (impostor + 1 + rand(n - 1)) % n;
  state.lastImpostor = impostor;
  // chi parla per primo: mai l'impostore, così non è svantaggiato
  let starter = rand(n);
  if (starter === impostor) starter = (starter + 1) % n;
  state.round += 1;
  state.cur = {
    word, hints, impostor, starter,
    revealIdx: 0, flipped: false,
    votes: {}, eliminated: undefined, guessed: null,
    timeLeft: state.timerSec, running: false
  };
  state.screen = "reveal";
}

/* ---------- scoring ---------- */
function scoreRound() {
  const c = state.cur;
  const cfg = SCORING[state.difficulty];
  const n = players().length;
  const res = players().map(() => ({ pts: 0, why: [] }));
  const caught = c.eliminated === c.impostor;
  let fooled = 0;

  for (let v = 0; v < n; v++) {
    if (v === c.impostor) continue;
    if (c.votes[v] === c.impostor) { res[v].pts += cfg.voto; res[v].why.push(`+${cfg.voto} voto sull'impostore`); }
    else fooled++;
  }
  const imp = res[c.impostor];
  if (!caught) { imp.pts += cfg.sopravvive; imp.why.push(`+${cfg.sopravvive} non scoperto`); }
  else if (c.guessed) { imp.pts += cfg.indovina; imp.why.push(`+${cfg.indovina} ha indovinato la parola`); }
  else {
    for (let v = 0; v < n; v++) if (v !== c.impostor) { res[v].pts += cfg.squadra; res[v].why.push(`+${cfg.squadra} impostore smascherato`); }
  }
  if (fooled > 0) { imp.pts += fooled * cfg.inganno; imp.why.push(`+${fooled * cfg.inganno} ingannati (${fooled})`); }
  return res;
}

function finishRound() {
  const res = scoreRound();
  res.forEach((r, i) => state.scores[i] += r.pts);
  const c = state.cur;
  state.history.push({
    round: state.round, word: c.word, hints: c.hints, impostor: c.impostor,
    eliminated: c.eliminated, guessed: c.guessed, deltas: res.map(r => r.pts), why: res.map(r => r.why)
  });
  state.screen = "round";
}

/* ---------- vote tally ---------- */
function tally() {
  const n = players().length;
  const counts = Array(n).fill(0);
  Object.values(state.cur.votes).forEach(t => counts[t]++);
  const max = Math.max(...counts);
  const top = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  return { counts, max, eliminated: top.length === 1 ? top[0] : null };
}

/* ---------- timer ---------- */
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } if (state.cur) state.cur.running = false; }
function toggleTimer() {
  const c = state.cur;
  if (c.running) { stopTimer(); render(); return; }
  if (c.timeLeft <= 0) c.timeLeft = state.timerSec;
  c.running = true;
  timerHandle = setInterval(() => {
    c.timeLeft -= 1;
    if (c.timeLeft <= 0) { c.timeLeft = 0; stopTimer(); render(); return; }
    const el = document.getElementById("timer");
    if (el) el.textContent = fmt(c.timeLeft);
  }, 1000);
  render();
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

/* ============================================================
   RENDER
   ============================================================ */
function topbar() {
  return `<div class="topbar"><span>Round ${state.round}/${state.totalRounds} · ${DIFF[state.difficulty].label}</span><button data-a="quit">Esci dalla partita</button></div>`;
}

function rulesHTML() {
  const rows = [
    ["Cittadino vota l'impostore", "voto"],
    ["Impostore eliminato (bonus a ogni cittadino)", "squadra"],
    ["Impostore non scoperto", "sopravvive"],
    ["Impostore: per ogni cittadino ingannato", "inganno"],
    ["Impostore eliminato ma indovina la parola", "indovina"]
  ];
  return `
  <details class="rules" ${state.screen === "setup" && !state.rulesClosed ? "open" : ""} id="rules">
    <summary>Come si gioca</summary>
    <div class="rules-body">
      <p>Da 3 a 12 giocatori, un solo telefono. Tutti ricevono la stessa <b>parola segreta</b>, tranne uno: <b>l'impostore</b>, che non la conosce ma riceve <b>2 suggerimenti</b> per bluffare.</p>
      <ol>
        <li><b>Distribuzione.</b> Passatevi il telefono. Ognuno tocca la carta, legge in segreto e la copre prima di passarla.</li>
        <li><b>Discussione.</b> A turno, partendo dal giocatore indicato, ognuno dice <b>una sola parola</b> collegata alla parola segreta. Fate due giri. Troppo precisi aiutate l'impostore, troppo vaghi sembrate voi l'impostore.</li>
        <li><b>Voto.</b> Ognuno indica chi secondo lui è l'impostore (non si può votare sé stessi). Chi prende più voti è eliminato. In caso di <b>pareggio</b> nessuno è eliminato e l'impostore si salva.</li>
        <li><b>Ultima chance.</b> Se l'impostore viene eliminato, può provare a dire la parola segreta ad alta voce. Se indovina, ruba punti.</li>
        <li><b>Fine.</b> Dopo l'ultimo round vince chi ha più punti.</li>
      </ol>
      <p class="ex">Esempio: la parola è <i>Pizza</i>. L'impostore vede i suggerimenti <i>Forno</i> e <i>Napoli</i>, e al suo turno dice "Margherita".</p>
      <h3>Punteggio</h3>
      <div class="scroll-x">
        <table class="score-table">
          <thead><tr><th>Situazione</th><th class="pts">Facile</th><th class="pts">Medio</th><th class="pts">Difficile</th></tr></thead>
          <tbody>
            ${rows.map(([l, k]) => `<tr><td>${l}</td>${["facile","medio","difficile"].map(d => `<td class="pts">+${SCORING[d][k]}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
      <p class="ex">Il voto dell'impostore non conta per i punti. Un innocente eliminato per errore non perde punti. Più alto il livello, più vaghi sono i suggerimenti: per questo l'impostore guadagna di più se la scampa.</p>
    </div>
  </details>`;
}

function renderSetup() {
  const saved = loadSaved();
  const names = state.names;
  return `
  <header class="hero">
    <span class="eyebrow">Gioco di parole e bluff</span>
    <h1>L'Impo<span>stor</span>e</h1>
    <p class="muted">Tutti conoscono la parola. Uno solo finge.</p>
  </header>

  ${saved && saved.screen !== "setup" ? `
  <div class="resume">
    <span>Partita in corso: round ${saved.round} di ${saved.totalRounds}</span>
    <button class="btn small" data-a="resume">Riprendi</button>
  </div>` : ""}

  <section class="panel">
    <div class="row" style="justify-content:space-between"><h3>Giocatori</h3><span class="muted">${names.length} / 12</span></div>
    <div class="stack">
      ${names.map((n, i) => `
      <div class="player-row">
        <span class="num">${i + 1}</span>
        <input id="p${i}" data-i="${i}" value="${esc(n)}" maxlength="16" aria-label="Nome giocatore ${i + 1}" autocomplete="off">
        <button class="icon-btn" data-a="del" data-i="${i}" aria-label="Rimuovi ${esc(n)}" ${names.length <= 3 ? "disabled" : ""}>×</button>
      </div>`).join("")}
    </div>
    ${names.length < 12 ? `<button class="btn ghost small" data-a="add" style="align-self:flex-start">+ Aggiungi giocatore</button>` : ""}
  </section>

  <section class="panel">
    <h3>Difficoltà</h3>
    <div class="seg diff">
      ${Object.entries(DIFF).map(([k, d]) => `
      <button data-a="diff" data-v="${k}" aria-pressed="${state.difficulty === k}"><b>${d.label}</b><small>${d.desc}</small></button>`).join("")}
    </div>
  </section>

  <section class="panel">
    <h3>Round</h3>
    <div class="seg compact" style="--n:4">
      ${[3, 5, 7, 10].map(r => `<button data-a="rounds" data-v="${r}" aria-pressed="${state.totalRounds === r}"><b>${r}</b></button>`).join("")}
    </div>
    <h3>Timer discussione</h3>
    <div class="seg compact" style="--n:4">
      ${[[0, "No"], [60, "1 min"], [90, "1:30"], [120, "2 min"]].map(([v, l]) => `<button data-a="timer" data-v="${v}" aria-pressed="${state.timerSec === v}"><b>${l}</b></button>`).join("")}
    </div>
  </section>

  ${state.error ? `<p class="err" role="alert">${esc(state.error)}</p>` : ""}
  <button class="btn block" data-a="start">Inizia la partita</button>

  ${rulesHTML()}`;
}

function renderReveal() {
  const c = state.cur;
  const n = players().length;
  const name = players()[c.revealIdx];
  const isImp = c.revealIdx === c.impostor;
  const front = isImp
    ? `<div class="face front imp">
         <span class="lbl">${esc(name)}, tu sei</span>
         <div class="word">L'impostore</div>
         <p style="opacity:.8;font-size:.9rem">Non conosci la parola. Usa questi suggerimenti per bluffare:</p>
         <div class="hint-list">
           <div class="hint"><span>Suggerimento 1</span><b>${esc(c.hints[0])}</b></div>
           <div class="hint"><span>Suggerimento 2</span><b>${esc(c.hints[1])}</b></div>
         </div>
       </div>`
    : `<div class="face front">
         <span class="lbl">${esc(name)}, la parola segreta è</span>
         <div class="word">${esc(c.word)}</div>
         <p style="color:var(--ink-soft);font-size:.9rem">Non dirla a nessuno. Uno di voi non la conosce.</p>
       </div>`;
  return `
  ${topbar()}
  <div class="pass">
    <span class="eyebrow">Passa il telefono a</span>
    <h2>${esc(name)}</h2>
    <div class="progress" aria-label="Giocatore ${c.revealIdx + 1} di ${n}">${players().map((_, i) => `<i class="${i < c.revealIdx ? "done" : ""}"></i>`).join("")}</div>
  </div>
  <div class="table-card">
    <button class="flipper ${c.flipped ? "on" : ""}" data-a="flip" aria-label="${c.flipped ? "Carta scoperta" : "Tocca per scoprire la tua carta"}">
      <div class="face back"><div class="mark">?</div><b style="font-family:var(--font-display);font-size:1.3rem">Tocca per scoprire</b><span style="opacity:.85;font-size:.9rem">Solo ${esc(name)} deve guardare</span></div>
      ${front}
    </button>
  </div>
  <button class="btn block" data-a="hide" ${c.flipped ? "" : "disabled"}>${c.revealIdx === n - 1 ? "Ho visto, iniziamo" : "Ho visto, copri e passa"}</button>`;
}

function renderDiscuss() {
  const c = state.cur;
  const n = players().length;
  const order = Array.from({ length: n }, (_, k) => (c.starter + k) % n);
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Discussione</span>
    <h2>Una parola a testa, due giri</h2>
    <p class="muted">Inizia <b style="color:var(--text)">${esc(players()[c.starter])}</b>, poi si prosegue in quest'ordine.</p>
  </header>
  <ol class="order">${order.map((i, k) => `<li class="${k === 0 ? "first" : ""}">${esc(players()[i])}</li>`).join("")}</ol>
  ${state.timerSec ? `
  <section class="panel" style="align-items:center">
    <div class="timer ${c.timeLeft === 0 ? "zero" : ""}" id="timer" aria-live="off">${fmt(c.timeLeft)}</div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost small" data-a="timer-toggle">${c.running ? "Pausa" : c.timeLeft === 0 ? "Ricomincia" : c.timeLeft < state.timerSec ? "Riprendi" : "Avvia timer"}</button>
    </div>
    ${c.timeLeft === 0 ? `<p class="muted">Tempo scaduto: andate al voto.</p>` : ""}
  </section>` : ""}
  <button class="btn block" data-a="to-vote">Andiamo al voto</button>`;
}

function renderVote() {
  const c = state.cur;
  const n = players().length;
  const done = Object.keys(c.votes).length;
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Votazione</span>
    <h2>Chi è l'impostore?</h2>
    <p class="muted">Contate fino a tre e indicate tutti insieme, poi segnate qui i voti. Anche l'impostore vota.</p>
  </header>
  <div class="stack">
    ${players().map((name, v) => `
    <div class="vote-row">
      <label for="v${v}">${esc(name)} vota</label>
      <select id="v${v}" data-vote="${v}" class="${c.votes[v] !== undefined ? "set" : ""}">
        <option value="">— scegli —</option>
        ${players().map((t, i) => i === v ? "" : `<option value="${i}" ${c.votes[v] === i ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
    </div>`).join("")}
  </div>
  <button class="btn block" data-a="reveal-vote" ${done < n ? "disabled" : ""}>${done < n ? `Mancano ${n - done} voti` : "Rivela il risultato"}</button>`;
}

function renderResult() {
  const c = state.cur;
  const { counts, max } = tally();
  const caught = c.eliminated === c.impostor;
  const elName = c.eliminated === null ? null : players()[c.eliminated];
  const impName = players()[c.impostor];
  let verdict;
  if (c.eliminated === null) {
    verdict = `<div class="verdict lose"><span class="eyebrow">Pareggio</span><h3>Nessuno è eliminato</h3><p>L'impostore era <b>${esc(impName)}</b> e si salva. La parola era <b>${esc(c.word)}</b>.</p></div>`;
  } else if (!caught) {
    verdict = `<div class="verdict lose"><span class="eyebrow">Errore</span><h3>${esc(elName)} era innocente</h3><p>L'impostore era <b>${esc(impName)}</b>. La parola era <b>${esc(c.word)}</b>.</p></div>`;
  } else if (c.guessed === null) {
    verdict = `<div class="verdict win"><span class="eyebrow">Smascherato</span><h3>${esc(impName)} era l'impostore</h3>
      <p>Ultima chance: ${esc(impName)} dice ad alta voce quale pensa sia la parola segreta. Gli altri giudicano.</p>
      <div class="row" style="margin-top:8px"><button class="btn red small" data-a="guess" data-v="1">Ha indovinato</button><button class="btn small" data-a="guess" data-v="0">Ha sbagliato</button></div></div>`;
  } else {
    verdict = c.guessed
      ? `<div class="verdict lose"><span class="eyebrow">Colpo di scena</span><h3>${esc(impName)} ha indovinato</h3><p>La parola era <b>${esc(c.word)}</b>. L'impostore ruba i punti della squadra.</p></div>`
      : `<div class="verdict win"><span class="eyebrow">Vittoria dei cittadini</span><h3>${esc(impName)} non ha indovinato</h3><p>La parola era <b>${esc(c.word)}</b>.</p></div>`;
  }
  const ready = !(caught && c.guessed === null);
  return `
  ${topbar()}
  <header class="hero"><span class="eyebrow">Risultato del voto</span><h2>I voti</h2></header>
  <div class="tally">
    ${players().map((p, i) => `
    <div class="bar ${counts[i] === max && max > 0 ? "top" : ""}">
      <span class="name">${esc(p)}${ready && i === c.impostor ? ' <span class="tag">imp</span>' : ""}</span>
      <div class="track"><div class="fill" style="width:${max ? (counts[i] / max) * 100 : 0}%"></div></div>
      <span class="n">${counts[i]}</span>
    </div>`).join("")}
  </div>
  ${verdict}
  ${ready ? `<p class="muted">Suggerimenti dell'impostore: <b style="color:var(--text)">${esc(c.hints[0])}</b> e <b style="color:var(--text)">${esc(c.hints[1])}</b>.</p>
  <button class="btn block" data-a="score">Calcola i punti</button>` : ""}`;
}

function standingsTable(deltas, why) {
  const order = players().map((_, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  const imp = state.screen === "round" ? state.cur.impostor : -1;
  return `
  <div class="scroll-x">
  <table class="score-table">
    <thead><tr><th>#</th><th>Giocatore</th>${deltas ? `<th class="pts">Round</th>` : ""}<th class="pts">Totale</th></tr></thead>
    <tbody>
      ${order.map((i, k) => `
      <tr>
        <td class="pts" style="text-align:left">${k + 1}</td>
        <td>${esc(players()[i])}${i === imp ? '<span class="tag">imp</span>' : ""}${why && why[i].length ? `<span class="why">${why[i].map(esc).join(" · ")}</span>` : ""}</td>
        ${deltas ? `<td class="pts delta ${deltas[i] > 0 ? "pos" : "zero"}">${deltas[i] > 0 ? "+" : ""}${deltas[i]}</td>` : ""}
        <td class="pts"><b>${state.scores[i]}</b></td>
      </tr>`).join("")}
    </tbody>
  </table>
  </div>`;
}

function renderRound() {
  const h = state.history[state.history.length - 1];
  const last = state.round >= state.totalRounds;
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Fine round ${state.round}</span>
    <h2>Punti del round</h2>
    <p class="muted">Parola: <b style="color:var(--text)">${esc(h.word)}</b> · Impostore: <b style="color:var(--text)">${esc(players()[h.impostor])}</b></p>
  </header>
  ${standingsTable(h.deltas, h.why)}
  <button class="btn block" data-a="${last ? "final" : "next"}">${last ? "Classifica finale" : `Round ${state.round + 1}`}</button>`;
}

function renderFinal() {
  const order = players().map((_, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  const top = state.scores[order[0]];
  const winners = order.filter(i => state.scores[i] === top).map(i => players()[i]);
  const pod = [order[1], order[0], order[2]];
  const cls = ["p2", "p1", "p3"];
  const pos = ["2°", "1°", "3°"];
  return `
  <header class="hero">
    <span class="eyebrow">Partita finita · ${state.totalRounds} round · ${DIFF[state.difficulty].label}</span>
    <h1 style="font-size:clamp(2rem,8vw,2.8rem)">${winners.length > 1 ? "Pari merito: " + winners.map(esc).join(" e ") : "Vince " + esc(winners[0])}</h1>
  </header>
  <div class="podium">
    ${pod.map((i, k) => i === undefined ? "<span></span>" : `<div class="${cls[k]}"><span class="pos">${pos[k]}</span><b>${esc(players()[i])}</b><span class="pt">${state.scores[i]}</span></div>`).join("")}
  </div>
  <section class="panel">
    <h3>Classifica</h3>
    ${standingsTable(null, null)}
  </section>
  <section class="panel">
    <h3>Round per round</h3>
    <div class="scroll-x">
    <table class="score-table">
      <thead><tr><th>R</th><th>Parola</th><th>Impostore</th><th>Esito</th></tr></thead>
      <tbody>
        ${state.history.map(h => `<tr><td class="pts" style="text-align:left">${h.round}</td><td>${esc(h.word)}</td><td>${esc(players()[h.impostor])}</td><td>${h.eliminated === h.impostor ? (h.guessed ? "Scoperto, ma indovina" : "Scoperto") : h.eliminated === null ? "Salvo (pareggio)" : "Non scoperto"}</td></tr>`).join("")}
      </tbody>
    </table>
    </div>
  </section>
  <div class="stack">
    <button class="btn block" data-a="again">Rivincita con gli stessi giocatori</button>
    <button class="btn ghost block" data-a="setup">Cambia giocatori o difficoltà</button>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  const scr = {
    setup: renderSetup, reveal: renderReveal, discuss: renderDiscuss, vote: renderVote,
    result: renderResult, round: renderRound, final: renderFinal
  }[state.screen];
  app.innerHTML = scr();
  save();
}

/* ============================================================
   EVENTS
   ============================================================ */
function go(screen) { state.screen = screen; render(); window.scrollTo({ top: 0 }); }

document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches(".player-row input")) { state.names[+t.dataset.i] = t.value; state.error = ""; save(); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select[data-vote]")) {
    const v = +t.dataset.vote;
    if (t.value === "") delete state.cur.votes[v]; else state.cur.votes[v] = +t.value;
    render();
    const again = document.getElementById(`v${v}`);
    if (again) again.focus();
  }
});

document.addEventListener("toggle", e => {
  if (e.target.id === "rules") state.rulesClosed = !e.target.open;
}, true);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  const c = state.cur;
  switch (a) {
    case "add": state.names.push(""); render(); document.getElementById(`p${state.names.length - 1}`)?.focus(); break;
    case "del": state.names.splice(+b.dataset.i, 1); render(); break;
    case "diff": state.difficulty = b.dataset.v; render(); break;
    case "rounds": state.totalRounds = +b.dataset.v; render(); break;
    case "timer": state.timerSec = +b.dataset.v; render(); break;
    case "start": {
      const names = state.names.map(n => n.trim());
      if (names.some(n => !n)) { state.error = "Dai un nome a ogni giocatore."; render(); return; }
      const lower = names.map(n => n.toLowerCase());
      if (new Set(lower).size !== lower.length) { state.error = "Ogni giocatore deve avere un nome diverso."; render(); return; }
      if (names.length < 3) { state.error = "Servono almeno 3 giocatori."; render(); return; }
      state.names = names;
      state.scores = names.map(() => 0);
      state.round = 0; state.history = []; state.error = ""; state.lastImpostor = -1;
      startRound(); go("reveal"); break;
    }
    case "resume": { const s = loadSaved(); if (s) { state = s; stopTimer(); render(); } break; }
    case "flip": if (!c.flipped) { c.flipped = true; render(); } break;
    case "hide":
      c.flipped = false;
      if (c.revealIdx < players().length - 1) {
        render();
        // aspetta che la carta sia coperta prima di mostrare il nome successivo
        setTimeout(() => { c.revealIdx += 1; render(); }, 450);
      } else { go("discuss"); }
      break;
    case "timer-toggle": toggleTimer(); break;
    case "to-vote": stopTimer(); go("vote"); break;
    case "reveal-vote": c.eliminated = tally().eliminated; go("result"); break;
    case "guess": c.guessed = b.dataset.v === "1"; render(); break;
    case "score": finishRound(); go("round"); break;
    case "next": startRound(); go("reveal"); break;
    case "final": go("final"); break;
    case "again": {
      state.scores = players().map(() => 0); state.round = 0; state.history = []; state.lastImpostor = -1;
      startRound(); go("reveal"); break;
    }
    case "setup": state = freshState(state); go("setup"); break;
    case "quit":
      if (b.dataset.confirm === "1") { stopTimer(); state = freshState(state); go("setup"); }
      else { b.dataset.confirm = "1"; b.textContent = "Tocca di nuovo per confermare"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Esci dalla partita"; } }, 3000); }
      break;
  }
});

/* ---------- boot ---------- */
function start(data) {
  state = data && data.screen ? data : freshState(loadSetup());
  if (state.cur) state.cur.running = false;
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
