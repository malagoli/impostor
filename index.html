/* Layout: una colonna stretta come un tavolo da gioco in panno verde; le carte sono l'unico oggetto "fisico". Look unico scuro, scelto di proposito. */

  --felt-line: #2a5c50;

  --ink-soft: #5b6660;
  --text: #e9f1ec;
  --text-soft: #a9c2b8;
  --gold: #f0b43c;
  --gold-ink: #3a2a05;
  --red: #e5553f;

  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r: 14px;

* { box-sizing: border-box; }

}

h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.eyebrow {

  font-size: 0.75rem;

  text-transform: uppercase;

.muted { color: var(--text-soft); }
.stack { display: flex; flex-direction: column; gap: 12px; }

.panel {

/* Buttons */
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--gold);

}
.btn {
  border: 0;
  border-radius: 999px;
  padding: 14px 22px;

  font-size: 1.05rem;
  background: var(--gold);
  color: var(--gold-ink);

}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--felt-line); }
.btn.red { background: var(--red); color: #fff; }
.btn.small { padding: 8px 14px; font-size: .9rem; }

/* Players */
.player-row { display: flex; gap: 8px; align-items: center; }
.player-row .num {
  font-family: var(--font-mono); color: var(--text-soft); width: 1.6em; text-align: right; font-size: .85rem;
}
.player-row input {
  flex: 1; min-width: 0;
  background: var(--felt-deep);
  border: 1px solid var(--felt-line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--felt-line);
  background: transparent; color: var(--text-soft); font-size: 1.2rem; line-height: 1;
}
.icon-btn:hover { color: var(--red); border-color: var(--red); }

/* Segmented choices */
.seg { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.seg button {
  border: 1px solid var(--felt-line);
  background: transparent;
  color: var(--text);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: left;
  display: flex; flex-direction: column; gap: 2px;
}
.seg button b { font-family: var(--font-display); font-size: 1.05rem; }
.seg button small { color: var(--text-soft); font-size: .8rem; line-height: 1.3; }
.seg button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.seg button[aria-pressed="true"] small { color: var(--gold-ink); opacity: .8; }
.seg.compact button { text-align: center; align-items: center; padding: 10px 6px; }
@media (max-width: 420px) { .seg.diff { grid-template-columns: 1fr; } }

/* Card flip */
.table-card { perspective: 1200px; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 5 / 7; }
.flipper {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.3,.7,.2,1);
  border: 0; padding: 0; background: none; color: inherit; display: block;
}
.flipper.on { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 26px; text-align: center; gap: 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35);
}
.face.back {
  background:
    repeating-linear-gradient(45deg, rgba(240,180,60,.16) 0 10px, transparent 10px 20px),
    var(--red);
  border: 8px solid var(--card);
  color: #fff;
}
.face.back .mark {
  font-family: var(--font-display); font-weight: 800; font-size: 5rem; line-height: 1;
  width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); color: var(--red);
}
.face.front { background: var(--card); color: var(--ink); transform: rotateY(180deg); }
.face.front .lbl { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.face.front .word { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 10vw, 2.9rem); line-height: 1.05; overflow-wrap: anywhere; }
.face.front.imp { background: var(--ink); color: var(--card); }
.face.front.imp .lbl { color: var(--gold); }
.face.front.imp .word { color: var(--red); }
.hint-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.hint {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  background: rgba(246,241,228,.08); border: 1px dashed rgba(240,180,60,.6);
  border-radius: 10px; padding: 10px 12px;
}
.hint span { font-family: var(--font-mono); font-size: .72rem; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
.hint b { font-family: var(--font-display); font-size: 1.3rem; }

.pass { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.pass h2 { font-size: 2rem; }
.progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--felt-line); }
.progress i.done { background: var(--gold); }

/* Discussion */
.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: o; }
.order li {
  counter-increment: o; display: flex; gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.18);
}
.order li::before { content: counter(o); font-family: var(--font-mono); color: var(--gold); width: 1.4em; }
.order li.first { box-shadow: inset 0 0 0 2px var(--gold); }
.timer {
  font-family: var(--font-mono); font-weight: 700; font-size: 3.4rem; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.timer.zero { color: var(--red); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Vote */
.vote-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; align-items: center; }
.vote-row label { font-weight: 600; overflow-wrap: anywhere; }
.vote-row select {
  width: 100%; background: var(--felt-deep); color: var(--text);
  border: 1px solid var(--felt-line); border-radius: 10px; padding: 10px; font: inherit;
}
.vote-row select.set { border-color: var(--gold); }

/* Tally */
.tally { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 7em) minmax(0, 1fr) 2em; gap: 10px; align-items: center; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 14px; border-radius: 7px; background: rgba(0,0,0,.25); overflow: hidden; }
.bar .fill { height: 100%; background: var(--text-soft); border-radius: 7px; }
.bar.top .fill { background: var(--gold); }
.bar .n { font-family: var(--font-mono); text-align: right; }

.verdict { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.verdict.win { background: rgba(127,212,155,.14); box-shadow: inset 0 0 0 2px var(--good); }
.verdict.lose { background: rgba(229,85,63,.14); box-shadow: inset 0 0 0 2px var(--red); }

/* Scores */
.score-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score-table th, .score-table td { padding: 9px 8px; border-bottom: 1px solid var(--felt-line); text-align: left; vertical-align: top; }
.score-table th { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); font-weight: 500; }
.score-table td.pts, .score-table th.pts { text-align: right; font-family: var(--font-mono); white-space: nowrap; }

.delta.pos { color: var(--good); }
.delta.zero { color: var(--text-soft); }
.tag {

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; }
.podium div { background: rgba(0,0,0,.2); border-radius: 12px 12px 4px 4px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

details.rules { border-top: 1px solid var(--felt-line); padding-top: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button {
  border: 1px solid var(--felt-line); background: transparent; color: var(--text);

.chips button small { font-family: var(--font-mono); font-size: .72rem; color: var(--text-soft); }
.chips button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.chips button[aria-pressed="true"] small { color: var(--gold-ink); }
.chips button[disabled] { opacity: .35; cursor: not-allowed; }
.info { font-size: .9rem; color: var(--text-soft); }
.info b { color: var(--text); }

/* Locked hint */
.hint.locked { border-style: solid; border-color: rgba(240,180,60,.35); background: transparent; }
.unlock {
  border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .85rem;
  background: var(--gold); color: var(--gold-ink);
}

/* Secret vote */
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choices button {
  border: 1px solid var(--felt-line); background: rgba(0,0,0,.15); color: var(--text);
  border-radius: 12px; padding: 14px 10px; font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere;
}
.choices button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.secret-card {
  border-radius: 22px; padding: 30px 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;
  background: repeating-linear-gradient(45deg, rgba(240,180,60,.10) 0 10px, transparent 10px 20px), rgba(0,0,0,.2);
  box-shadow: inset 0 0 0 2px var(--felt-line);

.out-list { display: flex; flex-wrap: wrap; gap: 6px; }
.out-list span { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.25); color: var(--text-soft); text-decoration: line-through; }
.guess-input {
  width: 100%; background: var(--card); color: var(--ink); border: 0; border-radius: 12px;
  padding: 16px; font: 700 1.3rem var(--font-display); text-align: center;
}
.guess-input::placeholder { color: var(--ink-soft); font-weight: 500; }
.ok { color: var(--good); font-weight: 700; }
.guess-row { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.18); }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .8rem; color: var(--text-soft); }
.topbar button { background: none; border: 0; color: var(--text-soft); text-decoration: underline; font-size: .8rem; padding: 4px; }
.err { color: var(--red); font-size: .9rem; }

@media (prefers-reduced-motion: reduce) {
  .flipper { transition: none; }
  .timer.zero { animation: none; }
  .btn { transition: none; }
}
</style>

const WORDS = {};
for (const [d, cats] of Object.entries(RAW)) {
  WORDS[d] = [];
  for (const [c, str] of Object.entries(cats)) {
    str.split(";").map(s => s.trim()).filter(Boolean).forEach(entry => {
      const [w, hs] = entry.split(":");
      const [h1, h2] = hs.split(",").map(s => s.trim());
      WORDS[d].push({ w: w.trim(), h: [h1, h2], c });
    });
  }
}

  facile:    { label: "Facile",    desc: "Parole comuni, suggerimenti vicini" },

  difficile: { label: "Difficile", desc: "Parole astratte, indizi vaghi" }

/* ============================================================
   PUNTEGGIO (per round)
   voto       → al cittadino, per ogni votazione in cui vota un impostore
   squadra    → a ogni cittadino, per ogni impostore eliminato che NON indovina la parola
   sopravvive → all'impostore non eliminato a fine round
   inganno    → all'impostore, per ogni voto di un cittadino finito su un innocente (max ingannoMax)
   indovina   → all'impostore eliminato che indovina la parola segreta
   costo      → tolto all'impostore che sblocca il 2° suggerimento (mai sotto zero)
   ============================================================ */
const SCORING = {
  facile:    { voto: 2, squadra: 1, sopravvive: 4, inganno: 1, ingannoMax: 3, indovina: 2, costo: 1 },
  medio:     { voto: 2, squadra: 1, sopravvive: 5, inganno: 1, ingannoMax: 3, indovina: 3, costo: 1 },
  difficile: { voto: 2, squadra: 2, sopravvive: 6, inganno: 1, ingannoMax: 3, indovina: 4, costo: 1 }
};
const TWO_IMPOSTORS_FROM = 7;
const MAX_VOTES_TWO = 3;

const STORE_KEY = "impostore-partita-v2";
let state;
let timerHandle = null;

function freshState(prev) {
  return {
    screen: "setup",
    names: prev?.names ?? ["Giulia", "Marco", "Sara", "Luca", "Chiara"],
    difficulty: prev?.difficulty ?? "medio",
    totalRounds: prev?.totalRounds ?? 5,
    timerSec: prev?.timerSec ?? 90,
    cats: prev?.cats ?? Object.keys(CATS),
    scores: [],
    round: 0,
    used: { facile: [], medio: [], difficile: [] },
    lastImpostors: [],
    cur: null,
    history: [],
    error: ""
  };
}

function save() {
  try {
    // nella schermata iniziale la partita salvata resta, così "Riprendi" la ritrova
    if (state.screen === "final") localStorage.removeItem(STORE_KEY);
    else if (state.screen !== "setup") localStorage.setItem(STORE_KEY, JSON.stringify(state));
    localStorage.setItem(STORE_KEY + "-setup", JSON.stringify({ names: state.names, difficulty: state.difficulty, totalRounds: state.totalRounds, timerSec: state.timerSec, cats: state.cats }));
  } catch (e) {}
}
function loadSaved() {
  try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function loadSetup() {
  try { const s = localStorage.getItem(STORE_KEY + "-setup"); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const players = () => state.names;
const impostorCount = n => n >= TWO_IMPOSTORS_FROM ? 2 : 1;
const catCount = (d, c) => WORDS[d].filter(x => x.c === c).length;
const poolSize = () => WORDS[state.difficulty].filter(x => state.cats.includes(x.c)).length;
const joinNames = arr => arr.map(i => players()[i]).map(esc).join(" e ");

/* ---------- round setup ---------- */
function pickWord() {
  const d = state.difficulty;
  const pool = WORDS[d].filter(x => state.cats.includes(x.c));
  let free = pool.filter(x => !state.used[d].includes(x.w));
  if (!free.length) { state.used[d] = state.used[d].filter(w => !pool.some(x => x.w === w)); free = pool; }
  const pick = free[rand(free.length)];
  state.used[d].push(pick.w);
  return pick;
}

function isImp(i) { return state.cur.impostors.includes(i); }
function active() { return players().map((_, i) => i).filter(i => !state.cur.out.includes(i)); }

function pickStarter() {
  const cand = active().filter(i => !isImp(i));
  return cand[rand(cand.length)];
}

function startRound() {
  const n = players().length;
  const k = impostorCount(n);
  // evita che gli stessi impostori escano due round di fila, se possibile
  let pool = players().map((_, i) => i).filter(i => !state.lastImpostors.includes(i));
  if (pool.length < k) pool = players().map((_, i) => i);
  const impostors = shuffle(pool).slice(0, k).sort((a, b) => a - b);
  state.lastImpostors = impostors;
  const pick = pickWord();
  state.round += 1;
  state.cur = {
    word: pick.w, hints: pick.h, cat: pick.c, impostors,
    maxTurns: k === 1 ? 1 : MAX_VOTES_TWO,
    revealIdx: 0, flipped: false, hint2: {},
    out: [], turns: [], turn: 1,
    starter: 0, voter: 0, choosing: false, pick: null,
    guesses: {},
    timeLeft: state.timerSec, running: false
  };
  state.cur.starter = pickStarter();
  state.screen = "reveal";
}

function roundOver() {
  const c = state.cur;
  const act = active();
  const impLeft = act.filter(isImp).length;
  const citLeft = act.length - impLeft;
  return impLeft === 0 || c.turns.length >= c.maxTurns || impLeft >= citLeft;
}

function nextDiscussion() {
  const c = state.cur;
  c.turn += 1;
  c.starter = pickStarter();
  c.voter = 0; c.choosing = false; c.pick = null;
  c.timeLeft = state.timerSec;
}

/* ---------- controllo della parola scritta ---------- */
function norm(s) {
  return String(s).toLowerCase().trim()
    .replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+/, "")
    .replace(/^(l|un|dell|nell)['’]\s*/, "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// uguale, oppure un solo errore di battitura per parole di almeno 5 lettere
function matches(guess, word) {
  const g = norm(guess), w = norm(word);
  if (!g) return false;
  return g === w || (w.length >= 5 && lev(g, w) <= 1);
}

function advanceVoter() {
  const c = state.cur;
  const act = active();
  c.pick = null; c.choosing = false; c.voter += 1;
  if (c.voter >= act.length) {
    const t = c.turns[c.turns.length - 1];
    t.eliminated = tally(t).eliminated;
    if (t.eliminated !== null) c.out.push(t.eliminated);
    go("result");
  } else go("vote");
}

/* ---------- scoring ---------- */
function scoreRound() {
  const c = state.cur;
  const cfg = SCORING[state.difficulty];
  const n = players().length;
  const pts = Array(n).fill(0);
  const why = players().map(() => []);
  const goodVotes = Array(n).fill(0);
  const fooled = {};
  c.impostors.forEach(i => fooled[i] = 0);

  c.turns.forEach((t, ti) => {
    const outBefore = c.turns.slice(0, ti).map(x => x.eliminated).filter(x => x !== null);
    const impsInGame = c.impostors.filter(i => !outBefore.includes(i));
    for (const [vs, target] of Object.entries(t.votes)) {
      const v = +vs;
      if (isImp(v)) continue;
      if (isImp(target)) goodVotes[v]++;
      else impsInGame.forEach(i => fooled[i]++);
    }
  });

  for (let v = 0; v < n; v++) {
    if (goodVotes[v]) {
      pts[v] += goodVotes[v] * cfg.voto;
      why[v].push(`+${goodVotes[v] * cfg.voto} ${goodVotes[v] > 1 ? `voti sull'impostore (${goodVotes[v]})` : "voto sull'impostore"}`);
    }
  }

  let caughtClean = 0;
  c.impostors.forEach(i => {
    const g = c.guesses[i];
    if (!c.out.includes(i)) { pts[i] += cfg.sopravvive; why[i].push(`+${cfg.sopravvive} non scoperto`); }
    if (g && g.ok) { pts[i] += cfg.indovina; why[i].push(`+${cfg.indovina} ha indovinato la parola`); }
    else if (c.out.includes(i)) caughtClean++;
  });
  if (caughtClean) {
    const bonus = caughtClean * cfg.squadra;
    for (let v = 0; v < n; v++) if (!isImp(v)) { pts[v] += bonus; why[v].push(`+${bonus} ${caughtClean > 1 ? "impostori smascherati" : "impostore smascherato"}`); }
  }

  c.impostors.forEach(i => {
    if (fooled[i]) {
      const g = Math.min(fooled[i] * cfg.inganno, cfg.ingannoMax);
      pts[i] += g;
      why[i].push(`+${g} ingannati (${fooled[i]}${fooled[i] * cfg.inganno > cfg.ingannoMax ? ", max " + cfg.ingannoMax : ""})`);
    }
    if (c.hint2[i]) {
      const cost = Math.min(cfg.costo, pts[i]);
      pts[i] -= cost;
      why[i].push(cost ? `−${cost} secondo suggerimento` : "secondo suggerimento (niente da scalare)");
    }
  });

  return { pts, why };
}

function finishRound() {
  const { pts, why } = scoreRound();
  pts.forEach((p, i) => state.scores[i] += p);
  const c = state.cur;
  state.history.push({
    round: state.round, word: c.word, hints: c.hints, cat: c.cat, impostors: c.impostors,
    out: c.out.slice(), guesses: { ...c.guesses }, hint2: { ...c.hint2 }, deltas: pts, why
  });
  state.screen = "round";
}

/* ---------- vote tally ---------- */
function tally(turn) {
  const n = players().length;
  const counts = Array(n).fill(0);
  Object.values(turn.votes).forEach(t => counts[t]++);
  const max = Math.max(...counts);
  const top = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  return { counts, max, eliminated: max > 0 && top.length === 1 ? top[0] : null };
}

/* ---------- timer ---------- */
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } if (state.cur) state.cur.running = false; }
function toggleTimer() {
  const c = state.cur;
  if (c.running) { stopTimer(); render(); return; }
  if (c.timeLeft <= 0) c.timeLeft = state.timerSec;
  c.running = true;
  timerHandle = setInterval(() => {
    c.timeLeft -= 1;
    if (c.timeLeft <= 0) { c.timeLeft = 0; stopTimer(); render(); return; }
    const el = document.getElementById("timer");
    if (el) el.textContent = fmt(c.timeLeft);
  }, 1000);
  render();
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

    </div>
    ${names.length < 12 ? `<button class="btn ghost small" data-a="add" style="align-self:flex-start">+ Aggiungi giocatore</button>` : ""}
    <p class="info">Con ${names.length} giocatori: <b>${k} impostor${k > 1 ? "i" : "e"}</b>${k > 1 ? `, fino a ${MAX_VOTES_TWO} votazioni per round` : `. Dai ${TWO_IMPOSTORS_FROM} giocatori diventano 2`}.</p>
  </section>

  <section class="panel">
    <h3>Difficoltà</h3>
    <div class="seg diff">
      ${Object.entries(DIFF).map(([key, dd]) => `
      <button data-a="diff" data-v="${key}" aria-pressed="${d === key}"><b>${dd.label}</b><small>${dd.desc}</small></button>`).join("")}
    </div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content:space-between"><h3>Categorie</h3><button class="btn ghost small" data-a="cats-all">${state.cats.length === Object.keys(CATS).length ? "Nessuna" : "Tutte"}</button></div>
    <div class="chips">
      ${Object.entries(CATS).map(([c, label]) => {
        const cnt = catCount(d, c);
        return `<button data-a="cat" data-v="${c}" aria-pressed="${state.cats.includes(c) && cnt > 0}" ${cnt ? "" : "disabled title=\"Non disponibile a questo livello\""}>${label}<small>${cnt}</small></button>`;
      }).join("")}
    </div>
    <p class="info"><b>${poolSize()}</b> parole disponibili a livello ${DIFF[d].label.toLowerCase()}.${catCount(d, "concetti") ? "" : " I Concetti ci sono solo a Medio e Difficile."}</p>
  </section>

  <section class="panel">
    <h3>Round</h3>
    <div class="seg compact" style="--n:4">
      ${[3, 5, 7, 10].map(r => `<button data-a="rounds" data-v="${r}" aria-pressed="${state.totalRounds === r}"><b>${r}</b></button>`).join("")}
    </div>
    <h3>Timer discussione</h3>
    <div class="seg compact" style="--n:4">
      ${[[0, "No"], [60, "1 min"], [90, "1:30"], [120, "2 min"]].map(([v, l]) => `<button data-a="timer" data-v="${v}" aria-pressed="${state.timerSec === v}"><b>${l}</b></button>`).join("")}
    </div>
  </section>

  ${state.error ? `<p class="err" role="alert">${esc(state.error)}</p>` : ""}
  <button class="btn block" data-a="start">Inizia la partita</button>

  ${rulesHTML()}`;
}

function renderReveal() {
  const c = state.cur;
  const n = players().length;
  const me = c.revealIdx;
  const name = players()[me];
  const imp = isImp(me);
  const two = c.impostors.length > 1;
  const cost = SCORING[state.difficulty].costo;
  const front = imp
    ? `<div class="face front imp">
         <span class="lbl">${esc(name)}, tu sei</span>
         <div class="word">${two ? "Un impostore" : "L'impostore"}</div>
         <p style="opacity:.8;font-size:.9rem">${two ? "Siete in due e non sai chi è l'altro. " : ""}Non conosci la parola: bluffa con i suggerimenti.</p>
         <div class="hint-list">
           <div class="hint"><span>Suggerimento 1</span><b>${esc(c.hints[0])}</b></div>
           ${c.hint2[me]
             ? `<div class="hint"><span>Suggerimento 2</span><b>${esc(c.hints[1])}</b></div>`
             : `<div class="hint locked"><span>Suggerimento 2</span><button class="unlock" data-a="unlock">Sblocca · −${cost} punto</button></div>`}
         </div>
       </div>`
    : `<div class="face front">
         <span class="lbl">${esc(name)}, la parola segreta è</span>
         <div class="word">${esc(c.word)}</div>
         <p style="color:var(--ink-soft);font-size:.9rem">Non dirla a nessuno. ${two ? "Due di voi non la conoscono." : "Uno di voi non la conosce."}</p>
       </div>`;
  return `
  ${topbar()}
  <div class="pass">
    <span class="eyebrow">Passa il telefono a</span>
    <h2>${esc(name)}</h2>
    <div class="progress" aria-label="Giocatore ${me + 1} di ${n}">${players().map((_, i) => `<i class="${i < me ? "done" : ""}"></i>`).join("")}</div>
  </div>
  <button class="btn block" data-a="hide" ${c.flipped && !c.hiding ? "" : "disabled"}>${me === n - 1 ? "Ho visto, iniziamo" : "Ho visto, copri e passa"}</button>
  <div class="table-card">
    <div class="flipper ${c.flipped ? "on" : ""}" data-a="flip" role="button" tabindex="0" style="cursor:pointer" aria-label="${c.flipped ? "Carta scoperta" : "Tocca per scoprire la tua carta"}">
      <div class="face back"><div class="mark">?</div><b style="font-family:var(--font-display);font-size:1.3rem">Tocca per scoprire</b><span style="opacity:.85;font-size:.9rem">Solo ${esc(name)} deve guardare</span></div>
      ${front}
    </div>
  </div>`;
}

function outList() {
  const c = state.cur;
  if (!c.out.length) return "";
  return `<div class="stack" style="gap:6px"><span class="eyebrow" style="color:var(--text-soft)">Eliminati</span><div class="out-list">${c.out.map(i => `<span>${esc(players()[i])}</span>`).join("")}</div></div>`;
}

function renderDiscuss() {
  const c = state.cur;
  const act = active();
  const s = act.indexOf(c.starter);
  const order = act.slice(s).concat(act.slice(0, s));
  const first = c.turn === 1;
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Discussione${c.maxTurns > 1 ? ` · votazione ${c.turn} di ${c.maxTurns}` : ""}</span>
    <h2>${first ? "Una parola a testa, due giri" : "Un altro giro di parole"}</h2>
    <p class="muted">Inizia <b style="color:var(--text)">${esc(players()[c.starter])}</b>, poi si prosegue in quest'ordine.${first ? "" : " Ognuno dice una parola nuova."}</p>
  </header>
  <ol class="order">${order.map((i, k) => `<li class="${k === 0 ? "first" : ""}">${esc(players()[i])}</li>`).join("")}</ol>
  ${outList()}
  ${state.timerSec ? `
  <section class="panel" style="align-items:center">
    <div class="timer ${c.timeLeft === 0 ? "zero" : ""}" id="timer" aria-live="off">${fmt(c.timeLeft)}</div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost small" data-a="timer-toggle">${c.running ? "Pausa" : c.timeLeft === 0 ? "Ricomincia" : c.timeLeft < state.timerSec ? "Riprendi" : "Avvia timer"}</button>
    </div>
    ${c.timeLeft === 0 ? `<p class="muted">Tempo scaduto: andate al voto.</p>` : ""}
  </section>` : ""}
  <button class="btn block" data-a="to-vote">Andiamo al voto segreto</button>`;
}

function renderVote() {
  const c = state.cur;
  const act = active();
  const voter = act[c.voter];
  const name = players()[voter];
  if (!c.choosing) {
    return `
    ${topbar()}
    <div class="pass">
      <span class="eyebrow">Voto segreto · ${c.voter + 1} di ${act.length}</span>
      <div class="progress">${act.map((_, k) => `<i class="${k < c.voter ? "done" : ""}"></i>`).join("")}</div>
    </div>
    <div class="secret-card">
      <span class="eyebrow">Passa il telefono a</span>
      <h2 style="font-size:2.2rem">${esc(name)}</h2>
      <p class="muted">Gli altri non guardano lo schermo.</p>
    </div>
    <button class="btn block" data-a="vote-open">Sono ${esc(name)}, voglio votare</button>`;
  }
  if (isImp(voter)) {
    const g = c.guesses[voter];
    const pts = SCORING[state.difficulty].indovina;
    if (g) return `
    ${topbar()}
    <header class="hero">
      <span class="eyebrow">Turno segreto di ${esc(name)}</span>
      <h2>Hai già scritto la tua parola</h2>
      <p class="muted">Gli impostori non votano. Hai scritto «${esc(g.text || "niente")}»: scoprirai a fine round se era giusta.</p>
    </header>
    <button class="btn block" data-a="imp-done">Continua e passa il telefono</button>`;
    return `
    ${topbar()}
    <header class="hero">
      <span class="eyebrow">Turno segreto di ${esc(name)}</span>
      <h2>Sei ${c.impostors.length > 1 ? "un " : "l'"}impostore: non voti</h2>
      <p class="muted">Scrivi qual è secondo te la parola segreta. Se è giusta guadagni <b style="color:var(--text)">+${pts} punti</b>. Hai un solo tentativo per round e nessuno saprà cosa hai scritto fino alla fine.</p>
    </header>
    <input id="guess" class="guess-input" type="text" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="La parola segreta è…" aria-label="La parola segreta">
    <button class="btn block red" data-a="guess-submit">Conferma la parola</button>
    <button class="btn ghost block" data-a="guess-skip">Non lo so, salta</button>`;
  }
  const others = act.filter(i => i !== voter);
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Voto segreto di ${esc(name)}</span>
    <h2>Chi vuoi eliminare?</h2>
    <p class="muted">Tocca un nome e conferma. Il voto resta nascosto fino alla fine.</p>
  </header>
  <div class="choices">
    ${others.map(i => `<button data-a="vote-pick" data-v="${i}" aria-pressed="${c.pick === i}">${esc(players()[i])}</button>`).join("")}
  </div>
  <button class="btn block red" data-a="vote-confirm" ${c.pick === null ? "disabled" : ""}>${c.pick === null ? "Scegli un nome" : `Conferma: elimina ${esc(players()[c.pick])}`}</button>`;
}

function renderResult() {
  const c = state.cur;
  const t = c.turns[c.turns.length - 1];
  const { counts, max } = tally(t);
  const over = roundOver();
  const el = t.eliminated;
  const caughtImps = c.impostors.filter(i => c.out.includes(i));
  const inGame = t.active || active().concat(el !== null ? [el] : []);

  let verdict;
  if (el === null) {
    verdict = `<div class="verdict lose"><span class="eyebrow">Pareggio</span><h3>Nessuno è eliminato</h3></div>`;
  } else if (isImp(el)) {
    verdict = `<div class="verdict win"><span class="eyebrow">Smascherato</span><h3>${esc(players()[el])} era ${c.impostors.length > 1 ? "un impostore" : "l'impostore"}</h3></div>`;
  } else {
    verdict = `<div class="verdict lose"><span class="eyebrow">Errore</span><h3>${esc(players()[el])} era innocente</h3></div>`;
  }

  let after = "";
  if (!over) {
    const left = c.impostors.filter(i => !c.out.includes(i)).length;
    after = `<p class="muted">${left > 1 ? "Ci sono ancora 2 impostori" : "C'è ancora un impostore"} in gioco. Si continua: votazione ${c.turns.length + 1} di ${c.maxTurns}.</p>
      <button class="btn block" data-a="next-turn">Nuovo giro di parole</button>`;
  } else {
    const survivors = c.impostors.filter(i => !c.out.includes(i));
    const guessBlocks = c.impostors.map(i => {
      const g = c.guesses[i];
      const txt = g && g.text;
      return `<div class="guess-row">
        <span>${esc(players()[i])} ha scritto: <b>${txt ? "«" + esc(txt) + "»" : "niente"}</b></span>
        <div class="row" style="justify-content:space-between">
          <span class="${g && g.ok ? "ok" : "muted"}">${g && g.ok ? "Giusta: guadagna punti" : "Sbagliata"}</span>
          ${txt ? `<button class="btn ghost small" data-a="guess-fix" data-i="${i}">${g.ok ? "Segna sbagliata" : "Segna giusta"}</button>` : ""}
        </div>
      </div>`;
    }).join("");
    after = `
      <section class="panel">
        <span class="eyebrow">Fine round</span>
        <p>La parola era <b>${esc(c.word)}</b> <span class="muted">(${CATS[c.cat]})</span>.</p>
        <p>${c.impostors.length > 1 ? "Impostori" : "Impostore"}: <b>${joinNames(c.impostors)}</b>${survivors.length ? ` · non scopert${survivors.length > 1 ? "i" : "o"}: <b>${joinNames(survivors)}</b>` : ""}.</p>
        <p class="muted">Suggerimenti: <b style="color:var(--text)">${esc(c.hints[0])}</b> e <b style="color:var(--text)">${esc(c.hints[1])}</b>${c.impostors.some(i => c.hint2[i]) ? ` · il 2° è stato sbloccato da ${joinNames(c.impostors.filter(i => c.hint2[i]))}` : ""}.</p>
        ${guessBlocks}
        <p class="info">Il controllo accetta articoli, accenti e un errore di battitura. Per un sinonimo decidete voi con il pulsante.</p>
        <button class="btn block" data-a="score">Calcola i punti</button>
      </section>`;
  }

  return `
  ${topbar()}
  <header class="hero"><span class="eyebrow">Risultato${c.maxTurns > 1 ? ` · votazione ${c.turns.length} di ${c.maxTurns}` : ""}</span><h2>I voti</h2></header>
  <div class="tally">
    ${players().map((p, i) => inGame.includes(i) ? `
    <div class="bar ${counts[i] === max && max > 0 ? "top" : ""}">
      <span class="name">${esc(p)}</span>
      <div class="track"><div class="fill" style="width:${max ? (counts[i] / max) * 100 : 0}%"></div></div>
      <span class="n">${counts[i]}</span>
    </div>` : "").join("")}
  </div>
  ${verdict}
  ${after}`;
}

function standingsTable(deltas, why, imps) {
  const order = players().map((_, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  return `
  <div class="scroll-x">
  <table class="score-table">
    <thead><tr><th>#</th><th>Giocatore</th>${deltas ? `<th class="pts">Round</th>` : ""}<th class="pts">Totale</th></tr></thead>
    <tbody>
      ${order.map((i, k) => `
      <tr>
        <td class="pts" style="text-align:left">${k + 1}</td>
        <td>${esc(players()[i])}${imps && imps.includes(i) ? '<span class="tag">imp</span>' : ""}${why && why[i].length ? `<span class="why">${why[i].map(esc).join(" · ")}</span>` : ""}</td>
        ${deltas ? `<td class="pts delta ${deltas[i] > 0 ? "pos" : "zero"}">${deltas[i] > 0 ? "+" : ""}${deltas[i]}</td>` : ""}
        <td class="pts"><b>${state.scores[i]}</b></td>
      </tr>`).join("")}
    </tbody>
  </table>
  </div>`;
}

function renderRound() {
  const h = state.history[state.history.length - 1];
  const last = state.round >= state.totalRounds;
  return `
  ${topbar()}
  <header class="hero">
    <span class="eyebrow">Fine round ${state.round}</span>
    <h2>Punti del round</h2>
    <p class="muted">Parola: <b style="color:var(--text)">${esc(h.word)}</b> · ${h.impostors.length > 1 ? "Impostori" : "Impostore"}: <b style="color:var(--text)">${joinNames(h.impostors)}</b></p>
  </header>
  ${standingsTable(h.deltas, h.why, h.impostors)}
  <button class="btn block" data-a="${last ? "final" : "next"}">${last ? "Classifica finale" : `Round ${state.round + 1}`}</button>`;
}

function outcome(h) {
  const caught = h.impostors.filter(i => h.out.includes(i));
  const guessed = h.impostors.filter(i => h.guesses[i] && h.guesses[i].ok);
  let s;
  if (h.impostors.length === 1) s = caught.length ? "Scoperto" : "Non scoperto";
  else s = `Scoperti ${caught.length} su 2`;
  if (guessed.length) s += h.impostors.length === 1 ? ", parola indovinata" : `, ${guessed.length} indovina`;
  return s;
}

function renderFinal() {
  const order = players().map((_, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  const top = state.scores[order[0]];
  const winners = order.filter(i => state.scores[i] === top).map(i => players()[i]);
  const pod = [order[1], order[0], order[2]];
  const cls = ["p2", "p1", "p3"];
  const pos = ["2°", "1°", "3°"];
  return `
  <header class="hero">
    <span class="eyebrow">Partita finita · ${state.totalRounds} round · ${DIFF[state.difficulty].label}</span>
    <h1 style="font-size:clamp(2rem,8vw,2.8rem)">${winners.length > 1 ? "Pari merito: " + winners.map(esc).join(" e ") : "Vince " + esc(winners[0])}</h1>
  </header>
  <div class="podium">
    ${pod.map((i, k) => i === undefined ? "<span></span>" : `<div class="${cls[k]}"><span class="pos">${pos[k]}</span><b>${esc(players()[i])}</b><span class="pt">${state.scores[i]}</span></div>`).join("")}
  </div>
  <section class="panel">
    <h3>Classifica</h3>
    ${standingsTable(null, null, null)}
  </section>
  <section class="panel">
    <h3>Round per round</h3>
    <div class="scroll-x">
    <table class="score-table">
      <thead><tr><th>R</th><th>Parola</th><th>Impostori</th><th>Esito</th></tr></thead>
      <tbody>
        ${state.history.map(h => `<tr><td class="pts" style="text-align:left">${h.round}</td><td>${esc(h.word)}</td><td>${joinNames(h.impostors)}</td><td>${outcome(h)}</td></tr>`).join("")}
      </tbody>
    </table>
    </div>
  </section>
  <div class="stack">
    <button class="btn block" data-a="again">Rivincita con gli stessi giocatori</button>
    <button class="btn ghost block" data-a="setup">Cambia giocatori o impostazioni</button>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  const scr = {
    setup: renderSetup, reveal: renderReveal, discuss: renderDiscuss, vote: renderVote,
    result: renderResult, round: renderRound, final: renderFinal
  }[state.screen];
  app.innerHTML = scr();
  save();
}

/* ============================================================
   EVENTS
   ============================================================ */
function go(screen) { state.screen = screen; render(); window.scrollTo({ top: 0 }); }

function resetMatch() {
  state.scores = players().map(() => 0);
  state.round = 0; state.history = []; state.lastImpostors = []; state.error = "";
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches(".player-row input")) { state.names[+t.dataset.i] = t.value; state.error = ""; save(); }
});

document.addEventListener("toggle", e => {
  if (e.target.id === "rules") state.rulesClosed = !e.target.open;
}, true);

document.addEventListener("keydown", e => {
  if (e.target.id === "guess" && e.key === "Enter") { e.preventDefault(); document.querySelector('[data-a="guess-submit"]')?.click(); return; }
  const f = e.target.closest?.('[data-a="flip"]');
  if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); f.click(); }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  const c = state.cur;
  switch (a) {
    case "add": state.names.push(""); render(); document.getElementById(`p${state.names.length - 1}`)?.focus(); break;
    case "del": state.names.splice(+b.dataset.i, 1); render(); break;
    case "diff": state.difficulty = b.dataset.v; render(); break;
    case "cat": {
      const v = b.dataset.v;
      state.cats = state.cats.includes(v) ? state.cats.filter(x => x !== v) : state.cats.concat(v);
      state.error = ""; render(); break;
    }
    case "cats-all": state.cats = state.cats.length === Object.keys(CATS).length ? [] : Object.keys(CATS); render(); break;
    case "rounds": state.totalRounds = +b.dataset.v; render(); break;
    case "timer": state.timerSec = +b.dataset.v; render(); break;
    case "start": {
      const names = state.names.map(n => n.trim());
      const lower = names.map(n => n.toLowerCase());
      if (names.some(n => !n)) state.error = "Dai un nome a ogni giocatore.";
      else if (new Set(lower).size !== lower.length) state.error = "Ogni giocatore deve avere un nome diverso.";
      else if (names.length < 3) state.error = "Servono almeno 3 giocatori.";
      else if (poolSize() < 5) state.error = "Scegli più categorie: servono almeno 5 parole a questo livello.";
      else state.error = "";
      if (state.error) { render(); return; }
      state.names = names;
      resetMatch();
      startRound(); go("reveal"); break;
    }
    case "resume": {
      const s = loadSaved();
      if (s && s.cur && Array.isArray(s.cur.impostors)) {
        stopTimer(); state = s; delete state.quit;
        state.cur.running = false; state.cur.hiding = false;
        go(state.screen);
      }
      break;
    }
    case "flip": if (!c.flipped && !c.hiding) { c.flipped = true; render(); } break;
    case "unlock": e.stopPropagation(); c.hint2[c.revealIdx] = true; render(); break;
    case "hide":
      if (c.hiding) break;
      c.flipped = false;
      if (c.revealIdx < players().length - 1) {
        c.hiding = true;
        render();
        // aspetta che la carta sia coperta prima di mostrare il nome successivo
        setTimeout(() => { if (state.cur !== c) return; c.revealIdx += 1; c.hiding = false; render(); }, 450);
      } else { go("discuss"); }
      break;
    case "timer-toggle": toggleTimer(); break;
    case "to-vote":
      stopTimer();
      c.voter = 0; c.choosing = false; c.pick = null;
      c.turns.push({ votes: {}, eliminated: null, active: active() });
      go("vote"); break;
    case "vote-open": c.choosing = true; c.pick = null; go("vote"); break;
    case "vote-pick": c.pick = +b.dataset.v; render(); break;
    case "vote-confirm": {
      const t = c.turns[c.turns.length - 1];
      t.votes[active()[c.voter]] = c.pick;
      advanceVoter();
      break;
    }
    case "guess-submit": {
      const inp = document.getElementById("guess");
      const text = inp.value.trim();
      if (!text) { inp.focus(); inp.placeholder = "Scrivi una parola, oppure salta"; return; }
      c.guesses[active()[c.voter]] = { text, ok: matches(text, c.word) };
      advanceVoter();
      break;
    }
    case "guess-skip": c.guesses[active()[c.voter]] = { text: "", ok: false }; advanceVoter(); break;
    case "imp-done": advanceVoter(); break;
    case "guess-fix": { const g = c.guesses[+b.dataset.i]; g.ok = !g.ok; render(); break; }
    case "next-turn": nextDiscussion(); go("discuss"); break;
    case "score": finishRound(); go("round"); break;
    case "next": startRound(); go("reveal"); break;
    case "final": go("final"); break;
    case "again": resetMatch(); startRound(); go("reveal"); break;
    case "setup": state = freshState(state); go("setup"); break;
    case "quit":
      if (b.dataset.confirm === "1") {
        stopTimer();
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...state, quit: true })); } catch (err) {}
        state = freshState(state); go("setup");
      }
      else { b.dataset.confirm = "1"; b.textContent = "Tocca ancora per uscire"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Esci"; } }, 3000); }
      break;
  }
});

/* ---------- boot ---------- */
function start(data) {
  const ok = data && data.screen && Array.isArray(data.cats) && (!data.cur || Array.isArray(data.cur.impostors));
  const saved = ok ? null : loadSaved();
  const savedOk = saved && !saved.quit && Array.isArray(saved.cats) && saved.cur && Array.isArray(saved.cur.impostors);
  state = ok ? data : savedOk ? saved : freshState(loadSetup());
  if (state.cur) state.cur.hiding = false;
  if (state.cur) state.cur.running = false;
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
